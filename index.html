<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный список покупок</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-shopping-cart"></i> Умный список покупок</h1>
            <p>Сравнение цен, аналитика корзины и история покупок</p>
        </header>

        <div class="navigation">
            <button class="nav-btn active" data-page="shopping-list">
                <i class="fas fa-list"></i> Список покупок
            </button>
            <button class="nav-btn" data-page="price-comparison">
                <i class="fas fa-store"></i> Сравнение цен
            </button>
            <button class="nav-btn" data-page="analytics">
                <i class="fas fa-chart-bar"></i> Аналитика
            </button>
        </div>

        <div id="shopping-list" class="page active"></div>
        <div id="price-comparison" class="page"></div>
        <div id="analytics" class="page"></div>
    </div>

    <div id="global-notifications"></div>

    <script type="module" src="js/main.js"></script>
    
</body>
</html>
